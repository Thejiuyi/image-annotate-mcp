[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-annotate-mcp"
version = "0.3.0"
description = "MCP server for human-in-the-loop image annotation: the user draws a box, the agent gets pixel coordinates, a name and a cropped template."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thejiuyi" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "annotation",
  "human-in-the-loop",
  "computer-vision",
  "template-matching",
  "game-automation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = [
  "mcp>=2.0,<3",
  "pillow>=10.0",
]

[project.optional-dependencies]
screen = ["mss>=9.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
annotate-mcp = "image_annotate_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/Thejiuyi/image-annotate-mcp"
Issues = "https://github.com/Thejiuyi/image-annotate-mcp/issues"
Changelog = "https://github.com/Thejiuyi/image-annotate-mcp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/image_annotate_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "README.zh-CN.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501", "B008", "N802", "N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
